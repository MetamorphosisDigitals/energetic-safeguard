<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #E6E2F0; color: #3B2F4C; display: grid; grid-template-rows: 1fr auto 1fr; overflow: hidden; font-family: Manrope, sans-serif; }
    .top-orbit { display: flex; justify-content: space-between; align-items: flex-start; padding: 54px 70px 0; }
    .brand { font-size: 15px; letter-spacing: .08em; color: #4A3F5A; display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 27px; height: 27px; border: 1px solid #6B8E9B; border-radius: 50%; display: grid; place-items: center; font-family: Fraunces, serif; color: #6B8E9B; font-size: 17px; }
    .edition { color: #6B8E9B; font-size: 12px; letter-spacing: .16em; }
    .hero { align-self: center; justify-self: center; width: 850px; text-align: center; display: grid; justify-items: center; gap: 22px; }
    .orbital { width: 108px; height: 108px; border-radius: 50%; background: rgba(255,255,255,.38); box-shadow: 0 0 40px 20px rgba(255,255,255,.28); display: grid; place-items: center; color: #6B8E9B; font-family: Fraunces, serif; font-size: 54px; }
    .eyebrow { color: #6B8E9B; font-size: 12px; letter-spacing: .20em; font-weight: 600; }
    h1 { font-family: Fraunces, serif; font-weight: 300; font-size: 68px; line-height: 1.02; letter-spacing: -.04em; }
    .tagline { font-family: Fraunces, serif; font-weight: 300; font-style: italic; font-size: 28px; line-height: 1.45; color: #4A3F5A; }
    .bottom-orbit { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin-bottom: 46px; }
    .line { width: 52px; height: 1px; background: #6B8E9B; opacity: .7; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #6B8E9B; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="top-orbit">
      <div class="brand"><span class="brand-mark">✦</span> ENERGETIC SAFEGUARD</div>
      <div class="edition">PRODUCT OVERVIEW</div>
    </div>
    <main class="hero">
      <div class="orbital">✦</div>
      <div class="eyebrow">A DAILY WELLNESS RHYTHM</div>
      <h1>The Energetic<br />Safeguard</h1>
      <p class="tagline">Ground your energy.<br />Protect your peace. Return to yourself.</p>
    </main>
    <div class="bottom-orbit"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
  </div>
</body>
</html>
