<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #E9E5F1; color: #382C49; font-family: Manrope, sans-serif; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; padding: 54px 68px 0; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 13px; letter-spacing: .1em; font-weight: 700; color: #4A3E5B; }
    .mark { width: 26px; height: 26px; border: 1px solid #7895A2; border-radius: 50%; display: grid; place-items: center; color: #7895A2; font-family: Fraunces, serif; font-size: 17px; }
    .label { color: #7895A2; font-size: 12px; letter-spacing: .17em; font-weight: 700; }
    .center { display: grid; justify-items: center; align-content: center; text-align: center; padding-top: 2px; }
    .eyebrow { color: #7895A2; font-size: 12px; letter-spacing: .19em; font-weight: 700; margin-bottom: 22px; }
    h1 { font-family: Fraunces, serif; font-size: 67px; line-height: 1.04; font-weight: 300; letter-spacing: -.045em; max-width: 860px; }
    .statement { font-family: Fraunces, serif; font-style: italic; font-size: 26px; font-weight: 300; line-height: 1.4; max-width: 710px; margin-top: 28px; color: #4A3E5B; }
    .signal { display: flex; align-items: center; gap: 11px; margin-top: 42px; }
    .signal i { display: block; width: 9px; height: 9px; border-radius: 50%; background: #7895A2; }
    .signal b { display: block; width: 88px; height: 1px; background: #7895A2; opacity: .75; }
    .bottom { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin-bottom: 44px; font-size: 12px; letter-spacing: .09em; color: #607983; }
    .bottom span { display: block; width: 41px; height: 1px; background: #7895A2; opacity: .55; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="top">
      <div class="brand"><div class="mark">✦</div> THE ENERGETIC SAFEGUARD</div>
      <div class="label">CLOSING PRINCIPLE</div>
    </div>
    <main class="center">
      <div class="eyebrow">A CONTINUITY-FIRST ARCHITECTURE</div>
      <h1>Billing supports<br />continuity.</h1>
      <p class="statement">It never stands between a user and a ritual.</p>
      <div class="signal"><b></b><i></i><b></b></div>
    </main>
    <div class="bottom"><span></span> SECURE · AUDITABLE · USER-OWNED <span></span></div>
  </div>
</body>
</html>
