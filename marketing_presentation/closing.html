<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #E6E2F0; color: #3B2F4C; font-family: Manrope, sans-serif; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 54px 74px 0; }
    .brand { display: flex; align-items: center; gap: 10px; color: #4A3F5A; font-size: 14px; letter-spacing: .08em; }
    .brand-mark { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #6B8E9B; display: grid; place-items: center; color: #6B8E9B; font-family: Fraunces, serif; font-size: 17px; }
    .close-label { color: #6B8E9B; font-size: 12px; letter-spacing: .16em; }
    .center { align-self: center; justify-self: center; width: 820px; text-align: center; display: grid; justify-items: center; gap: 23px; }
    .orbit { width: 118px; height: 118px; border-radius: 50%; background: rgba(255,255,255,.42); box-shadow: 0 0 38px 16px rgba(255,255,255,.26); display: grid; place-items: center; color: #6B8E9B; font-family: Fraunces, serif; font-size: 56px; }
    .eyebrow { color: #6B8E9B; font-size: 12px; letter-spacing: .20em; font-weight: 600; }
    h1 { font-family: Fraunces, serif; font-weight: 300; font-size: 57px; line-height: 1.06; letter-spacing: -.04em; }
    .tagline { font-family: Fraunces, serif; font-weight: 300; font-style: italic; font-size: 27px; line-height: 1.44; color: #4A3F5A; }
    .invitation { margin-top: 7px; color: #4A3F5A; font-size: 15px; letter-spacing: .02em; }
    .bottom { display: flex; justify-content: center; align-items: center; gap: 9px; margin-bottom: 45px; }
    .line { width: 55px; height: 1px; background: #6B8E9B; opacity: .7; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #6B8E9B; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="top">
      <div class="brand"><span class="brand-mark">✦</span> ENERGETIC SAFEGUARD</div>
      <div class="close-label">BEGIN WHERE YOU ARE</div>
    </div>
    <main class="center">
      <div class="orbit">✦</div>
      <div class="eyebrow">ONE SMALL RITUAL AT A TIME</div>
      <h1>Return to yourself.</h1>
      <p class="tagline">Ground your energy.<br />Protect your peace. Return to yourself.</p>
      <p class="invitation">Start your Daily Routine today.</p>
    </main>
    <div class="bottom"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
  </div>
</body>
</html>
