name: PostgreSQL Migration Candidate

on:
  push:
    branches: [migration/postgres]

permissions:
  contents: write

jobs:
  validate:
    name: Prepare and validate PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: energetic_safeguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d energetic_safeguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare PostgreSQL candidate
        run: |
          node scripts/repair-postgres-prep.mjs
          node scripts/prepare-postgres-migration.mjs
          node scripts/augment-postgres-candidate.mjs

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate PostgreSQL baseline
        run: pnpm db:generate

      - name: Apply PostgreSQL baseline
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/energetic_safeguard

      - name: PostgreSQL persistence integration
        run: pnpm exec vitest run server/postgres.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/energetic_safeguard

      - name: Upload generated candidate
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migration-candidate
          path: |
            package.json
            pnpm-lock.yaml
            drizzle.config.ts
            drizzle/schema.ts
            drizzle/postgres
            server/db.ts
            server/postgres.integration.test.ts
            server/payments/billingEventLedger.ts
            server/payments/billingEventLedger.test.ts
            .github/workflows/ci.yml
            POSTGRES_MIGRATION.md

      - name: Type check
        run: pnpm check

      - name: Safety selection-engine test matrix
        run: pnpm test:safety-engine

      - name: Full automated suite
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/energetic_safeguard

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E suite
        run: pnpm exec playwright test --workers=1
        env:
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/energetic_safeguard

      - name: Commit validated PostgreSQL migration
        run: |
          rm -f scripts/prepare-postgres-migration.mjs scripts/repair-postgres-prep.mjs scripts/augment-postgres-candidate.mjs
          git restore .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate persistence layer to PostgreSQL"
          git push origin HEAD:migration/postgres
