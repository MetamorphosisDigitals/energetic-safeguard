name: One-shot Netlify dependency lockfile

on:
  push:
    branches: [deploy/netlify-postgres]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/netlify-postgres
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm add serverless-http@4.0.0
      - name: Commit dependency metadata
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Dependency metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "Add serverless-http for Netlify"
          git push origin HEAD:deploy/netlify-postgres
