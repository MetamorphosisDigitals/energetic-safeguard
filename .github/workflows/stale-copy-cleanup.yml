name: One-shot stale launch copy cleanup

on:
  push:
    branches: [launch/stale-copy-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/stale-copy-cleanup
      - name: Remove stale launch copy
        run: |
          if [ -f scripts/cleanup-launch-copy.mjs ]; then
            node scripts/cleanup-launch-copy.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/src/pages/Home.tsx
            git rm scripts/cleanup-launch-copy.mjs
            git commit -m "Remove stale lifetime and coming-soon copy"
            git push origin HEAD:launch/stale-copy-cleanup
          fi
