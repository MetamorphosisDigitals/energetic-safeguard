name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Type, safety, test, build, and browser E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: energetic_safeguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d energetic_safeguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/energetic_safeguard

      - name: PostgreSQL persistence integration
        run: pnpm exec vitest run server/postgres.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/energetic_safeguard

      - name: Type check
        run: pnpm check

      - name: Safety selection-engine test matrix
        run: pnpm test:safety-engine

      - name: Full automated suite
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E suite
        run: pnpm exec playwright test --workers=1
        env:
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
